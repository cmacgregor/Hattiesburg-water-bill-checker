# ============================================================
# Home Assistant: Water bill notification from email
# ============================================================
# Replaces the retired water-bill-checker container (see README).
# Instead of scraping the Xpress-pay portal, Home Assistant watches
# your inbox for the utility's "bill ready" email and sends the
# same push notification.
# ============================================================


# ------------------------------------------------------------
# 1. SIGN UP FOR BILL EMAILS
# ------------------------------------------------------------
# Turn on e-billing / bill-ready email notifications for the water
# account (City of Hattiesburg utility account or Xpress-pay).
# Once the first bill email arrives, note its sender address and
# subject line; you need both below.


# ------------------------------------------------------------
# 2. ADD THE IMAP INTEGRATION (UI only, no YAML)
# ------------------------------------------------------------
# Settings → Devices & services → Add integration → IMAP
#
#   Server:   imap.gmail.com   (Gmail; use your provider's IMAP host otherwise)
#   Port:     993
#   Username: your email address
#   Password: an app password (Gmail: Google Account → Security →
#             2-Step Verification → App passwords). Your normal
#             password will not work with 2-step verification on.
#   Folder:   INBOX
#   Search:   UNSEEN   (the default; the automation filters by sender)
#
# Every new unread email fires an `imap_content` event.


# ------------------------------------------------------------
# 3. AUTOMATION
# ------------------------------------------------------------
# Add to automations.yaml, or paste into the UI automation editor
# (⋮ → Edit in YAML). Replace the sender and subject keyword with
# the values from step 1.

- alias: "Water Bill Email Notification"
  description: "Push a notification when the water bill email arrives."
  mode: queued
  triggers:
    - trigger: event
      event_type: imap_content
  conditions:
    # Only the first time HA sees a given message.
    - condition: template
      value_template: "{{ trigger.event.data.initial }}"
    - condition: template
      value_template: >
        {{ 'billing@example.com' in trigger.event.data.sender | lower
           and 'bill' in trigger.event.data.subject | lower }}
  actions:
    - action: notify.mobile_app_d_s24
      data:
        title: "💧 Water Bill Due"
        message: "{{ trigger.event.data.subject }}"
        data:
          url: "https://pay.xpress-pay.com/bill/search/e59f5554733c46658a100aa68b08545b"
          clickAction: "https://pay.xpress-pay.com/bill/search/e59f5554733c46658a100aa68b08545b"


# ------------------------------------------------------------
# 4. TEST
# ------------------------------------------------------------
# Temporarily change the sender in the condition to your own
# address, email yourself with "bill" in the subject, and confirm
# the notification arrives. Then put the real sender back.
