services:
  water-bill-checker:
    image: ghcr.io/cmacgregor/water-bill-checker:latest
    container_name: water-bill-checker
    restart: unless-stopped
    environment:
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
